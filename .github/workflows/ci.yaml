name: CI

on:
  push:
    branches: [ main ]
    paths: ['hangman-api/**']
  pull_request: 
    branches: [ main ]
    paths: ['hangman-api/**']
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js node-version
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: "npm"
          cache-dependency-path: hangman-api/package-lock.json
      - name : build
        working-directory: ./hangman-api
        run: |
          npm ci
          npm run build --if-present
      # - name: Upload artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dependencies
      #     path: hangman-api/node_modules/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js node-version
        uses: actions/setup-node@v4
        with:
          node-version: 16  
      # - name: Download artifact (dependencies)
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: dependencies
      #     path: hangman-api/node_modules/
      - name : test
        working-directory: ./hangman-api
        run: |
          npm ci
          npm test
      

  # audit:
  #   runs-on: ubuntu-latest
  #   if: ${{ always() }}
  #   needs: [test, build]
  #   steps:
  #     - name: Audit
  #       run: java --version 


  integration-tests:
    runs-on: ubuntu-latest
    # needs: build
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hangman_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js node-version
        uses: actions/setup-node@v4
        with:
          node-version: 16  
      - name : Creae database build-db-relationships
        working-directory: ./hangman-api
        env: 
          DATABASE_PORT: 5432
          DATABASE_HOST: localhost
          DATABASE_NAME: hangman_db
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_POOL_MIN: 2
          DATABASE_POOL_MAX: 10
        run: |
          npm ci
          npx knew migrate:latest --env development


      # - name : Run migrations
      #   working-directory: ./hangman-api
